<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SENA UPDATE</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#4d7fa8"/>
      <stop offset="0.28" stop-color="#2d5b83"/>
      <stop offset="0.7" stop-color="#173b5b"/>
      <stop offset="1" stop-color="#0c2944"/>
    </linearGradient>
    <linearGradient id="face" x1="0.15" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#32658f"/>
      <stop offset="0.35" stop-color="#204b73"/>
      <stop offset="0.78" stop-color="#173653"/>
      <stop offset="1" stop-color="#102c48"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8db1cd" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#5b8cb1" stop-opacity=".08"/>
      <stop offset="1" stop-color="#061d32" stop-opacity=".18"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="disc"><circle cx="512" cy="512" r="374"/></clipPath>
  </defs>
  <!-- The canvas is transparent outside the circular badge. -->
  <circle cx="512" cy="512" r="374" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="356" fill="url(#face)" stroke="#173a59" stroke-width="2"/>
  <circle cx="512" cy="512" r="356" fill="url(#shine)"/>
  <path d="M171 452 C190 287 326 166 493 159 C651 151 785 247 835 385" fill="none" stroke="#6c9abd" stroke-width="7" opacity=".23"/>
  <circle cx="512" cy="468" r="209" fill="#fff"/>
  <!-- Up arrow -->
  <path d="M512 299 L468 353 L496 353 L496 392 L528 392 L528 353 L556 353 Z" fill="#245780"/>
  <!-- Stylized headlamp / vehicle outline -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M389 477 C401 455 413 436 431 425 C453 412 503 401 552 398 C583 396 616 396 638 395 C649 395 653 402 647 415 L631 444 C618 467 598 487 579 507 L420 540 C401 542 384 533 378 518 C372 504 378 492 389 477 Z" fill="#24577f" stroke="#24577f" stroke-width="5"/>
    <path d="M414 472 C423 454 433 442 448 436 C472 426 518 418 557 416 C569 416 574 422 568 433 L546 469 C540 478 533 488 526 498 L412 519 C401 520 397 513 402 502 Z" fill="none" stroke="#fff" stroke-width="6"/>
    <path d="M548 436 C565 420 591 419 612 432 C633 445 641 472 632 494 C622 518 598 531 575 525 C550 519 534 498 535 474 C535 459 539 446 548 436 Z" fill="#24577f" stroke="#24577f" stroke-width="5"/>
    <circle cx="581" cy="477" r="35" fill="#fff" stroke="#24577f" stroke-width="10"/>
    <path d="M642 464 Q650 463 650 474 L650 492 Q650 500 644 500" fill="none" stroke="#24577f" stroke-width="6"/>
  </g>
  <!-- Lettering -->
  <text x="512" y="757" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="500" letter-spacing="1.5" fill="#fff">SENA</text>
  <text x="512" y="805" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="400" letter-spacing="6.5" fill="#fff">UPDATE</text>
  <!-- Subtle lower face shading, clipped to the badge -->
  <g clip-path="url(#disc)" opacity=".13">
    <path d="M150 675 C310 747 672 758 871 631 L871 900 L150 900 Z" fill="#061c30"/>
  </g>
